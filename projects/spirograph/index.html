<body data-spy="scroll" data-target=".onpage-navigation" data-offset="60">
    <main>
        <div class="page-loader">
            <div class="loader">Loading...</div>
        </div>
        <nav class="navbar navbar-custom navbar-fixed-top" role="navigation">
            <div class="container">
                <div class="navbar-header">
                    <button class="navbar-toggle" type="button" data-toggle="collapse"

                        Kublik</a>
                </div>

            </div>
        </nav>
        <div class="main">
            <section class="module" id="spirograph">
                <div class="container">
                    <div class="row">
                        <div class="col-sm-6" id="canvas_parent">
                            <canvas id="canvas"></canvas>
                        </div>
                        <div class="col-sm-6">
                            <div class="row">
                                <div class="col-sm-12">
                                    <h2 class="module-title font-alt align-left">Spirograph</h2>
                                    <div class="module-subtitle font-serif align-left">
                                        Adjust the controls to change the size of the wheel and location of the pens.
                                    </div>
                                </div>
                            </div>
                            <h6 class="font-alt "><i class="fa fa-fw"></i> Wheel Size </h6>
                            <div class=" progress">
                                <input type="range" class="form-range config" id="ring_size" min="0" max="1" value="0.5"
                                    step="0.01">
                            </div>

                            <div role="tabpanel">
                                <ul class="nav nav-tabs font-alt" role="tablist">
                                    <li class="active"><a href="#red_pen" data-toggle="tab"><i class="fa  fa-pencil"
                                                style="color:red"> </i> Red
                                            Pen</a></li>
                                    <li><a href="#blue_pen" data-toggle="tab"><i class="fa  fa-pencil"
                                                style="color:blue"> </i> Blue
                                            Pen</a>
                                    <li><a href="#green_pen" data-toggle="tab"><i class="fa fa-pencil"
                                                style="color:green"> </i> Green
                                            Pen</a>
                                    </li>
                                </ul>
                                <div class="tab-content">
                                    <div class="tab-pane active" id="red_pen">
                                        <input type="checkbox" id="red_pen_active" class="check config" checked />
                                        <label for="red_pen_active"> Enable red pen</label>
                                        <h6 class="font-alt"><i class="fa fa-arrows-h"></i> Radius </h6>
                                        <div class="progress">
                                            <input type="range" class="form-range config" id="red_pen_radius" min="0"
                                                max="1" value="0.5" step="0.01">
                                        </div>
                                        <h6 class="font-alt"><i class="fa fa-location-arrow"></i> Angle </h6>
                                        <div class="progress">
                                            <input type="range" class="form-range config" id="red_pen_angle" min="0"
                                                max="360" value="0" step="1">
                                        </div>
                                    </div>


                                    <div class="tab-pane " id="blue_pen">
                                        <input type="checkbox" id="blue_pen_active" class="check config" />
                                        <label for="blue_pen_active"> Enable blue pen</label>
                                        <h6 class="font-alt"><i class="fa fa-arrows-h"></i> Radius </h6> Radius </h6>
                                        <div class="progress">
                                            <input type="range" class="form-range config" id="blue_pen_radius" min="0"
                                                max="1" value="0.75" step="0.01">
                                        </div>
                                        <h6 class="font-alt"><i class="fa fa-location-arrow"></i> Angle </h6>
                                        <div class="progress">
                                            <input type="range" class="form-range config" id="blue_pen_angle" min="0"
                                                max="360" value="0" step="1">
                                        </div>
                                    </div>


                                    <div class="tab-pane " id="green_pen">
                                        <input type="checkbox" id="green_pen_active" class="check config" />
                                        <label for="green_pen_active"> Enable green pen</label>
                                        <h6 class="font-alt"><i class="fa fa-arrows-h"></i> Radius </h6> Radius </h6>
                                        <div class="progress">
                                            <input type="range" class="form-range config" id="green_pen_radius" min="0"
                                                max="1" value="0.25" step="0.01">
                                        </div>
                                        <h6 class="font-alt"><i class="fa fa-location-arrow"></i> Angle </h6>
                                        <div class="progress">
                                            <input type="range" class="form-range config" id="green_pen_angle" min="0"
                                                max="360" value="0" step="1">
                                        </div>
                                    </div>


                                </div>
                            </div>
                            <button class="btn btn-b btn-circle" id="run">Run</button>
                        </div>
                    </div>
                </div>
            </section>
