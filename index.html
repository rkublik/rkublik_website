<!DOCTYPE html>
<html>

<head>
    !-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-20QS1826GQ"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());

        gtag('config', 'G-20QS1826GQ');
    </script>
    <script type="text/javascript">
        function send_to_page(page) {
            window.location.replace(page)
        }
        // check language preference
        var langs = window.navigator.languages;
        for (val of langs) {
            if (val.indexOf('en') >= 0) { send_to_page("en"); break; }
            else if (val.indexOf('fr') >= 0) { send_to_page("fr"); break; }
        }
        // If nothing found, english by default
        send_to_page("en")
        // If all else fails, let the user select below.
    </script>
</head>

<body>
    <h1> select your language</h1>
    <ul>
        <li><a href="en/">English</a></li>
        <li><a href="fr/">Français</a></li>
    </ul>
</body>

</html>
